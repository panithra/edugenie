<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - Learning Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #3730a3;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-height: 80px;
            white-space: pre-wrap;
        }

        .health {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 EduGenie</h1>
    <p>Google Gemini Powered Learning Assistant</p>
</header>

<div class="container">

    <div class="card">
        <h2>Ask EduGenie</h2>

        <textarea
            id="inputText"
            placeholder="Enter your question or learning topic here..."
        ></textarea>

        <div class="buttons">
            <button onclick="callAPI('/qa')">❓ Q&A</button>
            <button onclick="callAPI('/explain')">💡 Explain</button>
            <button onclick="callAPI('/quiz')">📝 Quiz</button>
            <button onclick="callAPI('/summarize')">📄 Summary</button>
            <button onclick="callAPI('/learn/recommendations')">
                🛤️ Learning Path
            </button>
        </div>

        <div id="status"></div>

        <div id="result">
            Your result will appear here...
        </div>
    </div>

    <div class="card health">
        <h3>Server Status</h3>
        <button onclick="checkHealth()">Check Server</button>
        <p id="healthStatus">Not checked yet.</p>
    </div>

</div>

<script>

async function callAPI(endpoint) {

    const input = document.getElementById("inputText").value.trim();
    const result = document.getElementById("result");
    const status = document.getElementById("status");

    if (!input) {
        status.textContent = "Please enter a question or topic.";
        return;
    }

    status.textContent = "Processing...";

    result.textContent = "";

    try {

        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: input
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Something went wrong."
            );
        }

        result.textContent = data.result;

        status.textContent = "Done!";

    } catch (error) {

        result.textContent =
            "Error: " + error.message;

        status.textContent = "Request failed.";

    }
}


async function checkHealth() {

    const healthStatus =
        document.getElementById("healthStatus");

    try {

        const response =
            await fetch("/health");

        const data =
            await response.json();

        healthStatus.textContent =
            "✅ " + data.status +
            " - " + data.service;

    } catch (error) {

        healthStatus.textContent =
            "❌ Server is not responding.";

    }
}

</script>

</body>
</html>
